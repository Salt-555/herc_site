<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaylord's Shop</title>
    <link rel="stylesheet" href="styles.css?v=15">
</head>
<body>
    <div class="shop-container">
        <header class="shop-header">
            <h1>Welcome to Gaylord's Shop</h1>
        </header>
        
        <main class="character-stage">
            <div id="character-display" class="character-wrapper">
                <video id="tv-player" class="scene-media tv-video" muted playsinline loop preload="auto"></video>
                <video id="game-cabinet-player" class="scene-media game-cabinet-video" muted playsinline loop preload="auto"></video>
                <canvas id="arcade-canvas" class="arcade-canvas" width="770" height="632" hidden></canvas>
                <div id="tv-vhs-menu" class="tv-vhs-menu" hidden>
                    <div class="vhs-tracking">PLAY  SP  00:00:00</div>
                    <div class="vhs-title">HERCULES<br>RECYCLED 2.0</div>
                    <p class="vhs-copy">A redubbed sword-and-sandal transmission from the end of civilization.</p>
                    <a class="vhs-action" href="https://www.amazon.com/Hercules-Recycled-2-0-Steve-Reeves/dp/B08DSS9TKD" target="_blank" rel="noopener">BUY / RENT ON AMAZON</a>
                    <div class="vhs-footer">INSERT PAYMENT METHOD TO CONTINUE</div>
                </div>
                <img id="idle-image" src="Media/Processed/idle/base.jpg?v=1" alt="Gaylord" class="scene-media character-img">
                <video id="idle-base-player" class="scene-media base-video" muted playsinline loop preload="auto" poster="Media/Processed/idle/base.jpg?v=1"></video>
                <video id="animation-player" class="scene-media character-video" muted playsinline preload="auto"></video>
                <audio id="bg-music-player" preload="auto" muted></audio>
                <div id="tv-hotspot" class="hotspot"></div>
                <div id="game-hotspot" class="hotspot"></div>
                <button id="back-button" class="back-button" type="button" hidden>Go Back</button>
            </div>
        </main>
        
        <footer class="shop-footer">
            <p>Made it yourself</p>
        </footer>
        
        <div id="audio-controls" class="audio-controls">
            <button id="mute-button" class="mute-button" type="button" title="Toggle sound">
                <svg class="speaker-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path class="sound-waves" d="M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14"></path>
                    <line class="mute-x" x1="2" y1="2" x2="22" y2="22" style="display:none"></line>
                </svg>
            </button>
            <input id="volume-slider" class="volume-slider" type="range" min="0" max="100" value="100" title="Volume">
        </div>
        <aside id="arcade-controls" class="arcade-controls" hidden aria-live="polite"></aside>
        <canvas id="smoke-canvas" class="smoke-overlay"></canvas>
        <div id="eye-overlay" class="eye-overlay">
            <div class="eyelid eyelid-top"></div>
            <div class="eyelid eyelid-bottom"></div>
        </div>
    </div>
    
    <script src="Media/BG_TV/manifest.js?v=3"></script>
    <script src="Media/Game_Cabinet/manifest.js?v=1"></script>
    <script src="Media/BG_Music/manifest.js?v=1"></script>
    <script src="arcade.js?v=1"></script>
    <script src="script.js?v=28"></script>
    <script src="smoke.js?v=3"></script>
</body>
</html>
